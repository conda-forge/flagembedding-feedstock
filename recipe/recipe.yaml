context:
  version: "1.4.1"

package:
  name: flagembedding
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/FlagEmbedding/flagembedding-${{ version }}.tar.gz
    sha256: ed61607726b915e9e48976b23709530f2edcbbd68866f2a17d0d27e4041caaf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install .

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch >=1.6.0
    - transformers >=4.44.2
    - datasets >=2.19.0
    - accelerate >=0.20.1
    - sentence-transformers
    - peft
    - sentencepiece
    - protobuf

tests:
  - python:
      imports:
        - FlagEmbedding
      pip_check: false
      python_version: ${{ python_min }}

about:
  homepage: https://github.com/FlagOpen/FlagEmbedding
  summary: FlagEmbedding
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - moritzwilksch
